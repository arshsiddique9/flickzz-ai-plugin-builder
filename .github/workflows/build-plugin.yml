name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      plugin_name:
        required: true
      callback_url:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Source ZIP
        run: |
          mkdir -p plugin-src
          cd plugin-src
          DOWNLOAD_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/flickzz-builder-artifacts/sources/${{ github.event.inputs.build_id }}.zip"
          HTTP_CODE=$(curl -s -L -w "%{http_code}" -o source.zip \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "$DOWNLOAD_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Source download failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          unzip -q source.zip && rm source.zip
          echo "✅ Source extracted"

      - name: Build with Maven (with Auto-Fix)
        id: build_step
        run: |
          cd plugin-src
          set +e
          
          for attempt in 1 2 3; do
            echo "═══════════════════════════════════════════"
            echo "BUILD ATTEMPT $attempt"
            echo "═══════════════════════════════════════════"
            
            mvn -B clean package -DskipTests > build.log 2>&1
            MVN_EXIT=$?
            
            if [ $MVN_EXIT -eq 0 ]; then
              echo "✅ Build successful on attempt $attempt"
              break
            fi
            
            echo "❌ Build failed on attempt $attempt"
            
            if [ $attempt -eq 3 ]; then
              echo "❌ Max attempts reached. Build failed permanently."
              cat build.log
              exit 1
            fi
            
            echo "🤖 Triggering AI Auto-Fix..."
            node ../scripts/auto-fix.js
            
            if [ $? -ne 0 ]; then
              echo "❌ Auto-Fix failed to run. Aborting."
              exit 1
            fi
            
            echo "🔄 Retrying Maven build..."
          done
          
          set -e
          
          JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ No JAR found!"
            exit 1
          fi
          echo "✅ Found JAR: $JAR_FILE"
          echo "JAR_PATH=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR to Supabase
        if: success()
        run: |
          cd plugin-src
          JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" | head -1)
          ARTIFACT_KEY="artifacts/${{ github.event.inputs.build_id }}.jar"
          curl -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/flickzz-builder-artifacts/$ARTIFACT_KEY" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/java-archive" \
            -H "x-upsert: true" \
            --data-binary "@$JAR_FILE"
          echo "✅ JAR uploaded to Supabase"

      - name: Notify Backend (Success)
        if: success()
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}","status":"success","artifact_key":"artifacts/${{ github.event.inputs.build_id }}.jar"}'

      - name: Notify Backend (Failure)
        if: failure()
        run: |
          ERROR_MSG=$(tail -c 2000 plugin-src/build.log | tr '\n' '|' | sed 's/"/\\"/g')
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ github.event.inputs.build_id }}\",\"status\":\"failed\",\"error\":\"$ERROR_MSG\"}"
