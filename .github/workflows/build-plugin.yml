name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      plugin_name:
        required: true
      callback_url:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Source ZIP
        run: |
          mkdir -p plugin-src
          cd plugin-src
          DOWNLOAD_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/flickzz-builder-artifacts/sources/${{ github.event.inputs.build_id }}.zip"
          HTTP_CODE=$(curl -s -L -w "%{http_code}" -o source.zip \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "$DOWNLOAD_URL")
          [ "$HTTP_CODE" != "200" ] && { echo "❌ Download failed: $HTTP_CODE"; exit 1; }
          unzip -q source.zip && rm source.zip
          echo "✅ Source extracted"

      - name: Build Context
        run: |
          cd plugin-src
          export USER_PROMPT="${{ github.event.inputs.plugin_name }}"
          [ -f ../scripts/build-context.js ] && node ../scripts/build-context.js || true

      - name: Probe Free Models
        run: |
          set +e
          cd $GITHUB_WORKSPACE
          node index.js --probe
          echo "--- probe complete ---"

      - name: Run Agentic Auto-Fix
        id: agent
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          set +e
          cd $GITHUB_WORKSPACE
          cd plugin-src
          mvn -B clean package -DskipTests > build.log 2>&1
          MVN_EXIT=$?
          cd ..
          echo "=== Maven exit code: $MVN_EXIT ==="

          if [ $MVN_EXIT -eq 0 ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "❌ Initial build failed. Spawning agent..."
          node index.js ./plugin-src 25
          AGENT_EXIT=$?
          echo "=== Agent exit code: $AGENT_EXIT ==="

          if [ $AGENT_EXIT -ne 0 ]; then
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi

          cd plugin-src
          mvn -B clean package -DskipTests > build.log 2>&1
          MVN_EXIT=$?
          cd ..
          echo "=== Final Maven exit code: $MVN_EXIT ==="

          if [ $MVN_EXIT -eq 0 ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Find JAR
        if: env.BUILD_SUCCESS == 'true'
        run: |
          cd plugin-src
          JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" | head -1)
          [ -z "$JAR_FILE" ] && { echo "❌ No JAR"; exit 1; }
          echo "JAR_PATH=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR to Supabase
        if: env.BUILD_SUCCESS == 'true'
        run: |
          cd plugin-src
          JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" | head -1)
          curl -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/flickzz-builder-artifacts/artifacts/${{ github.event.inputs.build_id }}.jar" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/java-archive" \
            -H "x-upsert: true" \
            --data-binary "@$JAR_FILE"

      - name: Notify Backend (Success)
        if: env.BUILD_SUCCESS == 'true'
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}","status":"success","artifact_key":"artifacts/${{ github.event.inputs.build_id }}.jar"}'

      - name: Notify Backend (Failure)
        if: ${{ always() && env.BUILD_SUCCESS != 'true' }}
        run: |
          cd plugin-src
          ERROR_MSG=$(tail -c 2000 build.log 2>/dev/null | tr '\n' '|' | sed 's/"/\\"/g' | head -c 2000)
          [ -z "$ERROR_MSG" ] && ERROR_MSG="Build failed without log"
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ github.event.inputs.build_id }}\",\"status\":\"failed\",\"error\":\"$ERROR_MSG\"}"
