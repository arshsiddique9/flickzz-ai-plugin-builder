      - name: Capture Build Log
        if: always()
        id: build_log
        working-directory: ./plugin-src
        run: |
          if [ -f target/build.log ]; then
            cat target/build.log > /tmp/build_output.txt
          fi
          mvn -B clean package -DskipTests > /tmp/build_output.txt 2>&1 || true
          
          # Trim to last 3000 chars (Supabase payload limit)
          tail -c 3000 /tmp/build_output.txt > /tmp/build_error.txt
          
          # Escape for JSON
          python3 -c "
import json
with open('/tmp/build_error.txt', 'r') as f:
    content = f.read()
with open('/tmp/build_error_json.txt', 'w') as f:
    f.write(json.dumps(content))
          "

      - name: Notify Backend - Success
        if: success()
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifact_key\":\"artifacts/$BUILD_ID.jar\"}"

      - name: Notify Backend - Failure
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          ERROR_JSON=$(cat /tmp/build_error_json.txt 2>/dev/null || echo '""')
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"error\":$ERROR_JSON}"
