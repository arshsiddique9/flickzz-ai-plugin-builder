name: Build Minecraft Plugin

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build ID'
        required: true
        type: string
      plugin_name:
        description: 'Plugin main class name'
        required: true
        type: string
      callback_url:
        description: 'Callback URL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "❌ Missing Supabase secrets!"
            exit 1
          fi
          echo "✅ Secrets present"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download source from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          mkdir -p plugin-src
          cd plugin-src
          DOWNLOAD_URL="$SUPABASE_URL/storage/v1/object/flickzz-builder-artifacts/sources/$BUILD_ID.zip"
          HTTP_CODE=$(curl -s -L -w "%{http_code}" -o source.zip \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            "$DOWNLOAD_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Source download failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          unzip -q source.zip && rm source.zip
          echo "✅ Source extracted"
          find . -type f

      - name: Build with Maven
        id: maven
        working-directory: ./plugin-src
        run: |
          echo "Starting Maven build..."
          set +e
          mvn -B clean package -DskipTests 2>&1 | tee build.log
          MVN_EXIT=$?
          set -e

          if [ $MVN_EXIT -ne 0 ]; then
            echo "❌ Maven build failed"
            # Extract only ERROR lines for cleaner callback
            grep -E "\[ERROR\]|error:" build.log | head -50 > errors.txt || true
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ No JAR found!"
            exit 1
          fi
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "✅ Found JAR: $JAR_FILE"

      - name: Upload JAR to Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          JAR_FILE="./plugin-src/${{ steps.maven.outputs.jar_path }}"
          UPLOAD_URL="$SUPABASE_URL/storage/v1/object/flickzz-builder-artifacts/artifacts/$BUILD_ID.jar"
          HTTP_CODE=$(curl -s -X POST -w "%{http_code}" -o /dev/null \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/java-archive" \
            --data-binary "@$JAR_FILE" \
            "$UPLOAD_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ JAR upload failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ JAR uploaded"

      - name: Notify Backend - Success
        if: success()
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifact_key\":\"artifacts/$BUILD_ID.jar\"}"

      - name: Notify Backend - Failure
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          # Extract concise error (only compile errors)
          if [ -f "./plugin-src/errors.txt" ]; then
            ERROR_MSG=$(cat ./plugin-src/errors.txt | head -30 | tr '\n' '|' | sed 's/"/\\"/g' | head -c 2500)
          elif [ -f "./plugin-src/build.log" ]; then
            ERROR_MSG=$(tail -c 2500 ./plugin-src/build.log | tr '\n' '|' | sed 's/"/\\"/g')
          else
            ERROR_MSG="Build failed - no log available"
          fi

          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"error\":\"$ERROR_MSG\"}"
